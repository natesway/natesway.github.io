const midiArrayBuffer = Uint8Array.from(atob(midiBase64), c => c.charCodeAt(0)).buffer;
let midiData = new Midi(midiArrayBuffer);
let scheduledEvents = [];

// Master gain + recorder
const masterGain = new Tone.Gain(0.8).toDestination();
const recorder = new Tone.Recorder();
masterGain.connect(recorder);
recorder.toDestination();

async function scheduleTheLegendPlayback(){
    scheduledEvents.forEach(id => Tone.Transport.clear(id));
    scheduledEvents = [];

    midiData.tracks.forEach((track, index)=>{
        const bitcrusher = new Tone.BitCrusher(4);
        const reverb = new Tone.Reverb({decay:0.3, wet:0.15});
        reverb.generate();

        let synth;
        if(track.instrument.name.toLowerCase().includes("drum") || track.notes.length === 0){
            synth = new Tone.MembraneSynth({pitchDecay:0.01, octaves:1, envelope:{attack:0.001, decay:0.1, sustain:0, release:0.05}});
        } else if(index === 0){
            synth = new Tone.Synth({oscillator:{type:"square"}, envelope:{attack:0.005, decay:0.1, sustain:0.3, release:0.1}});
        } else if(index === 1){
            synth = new Tone.MonoSynth({oscillator:{type:"square", modulationType:"square", phase:0, harmonicity:1.01}, filter:{Q:1, type:"lowpass"}, envelope:{attack:0.001, decay:0.15, sustain:0.5, release:0.2}});
        } else {
            synth = new Tone.Synth({oscillator:{type:"triangle"}, envelope:{attack:0.02, decay:0.1, sustain:0.2, release:0.1}});
        }

        // Connect chain: synth → bitcrusher → reverb → masterGain → recorder → destination
        synth.connect(bitcrusher);
        bitcrusher.connect(reverb);
        reverb.connect(masterGain);

        // Stereo panning
        const panner = new Tone.Panner((index / midiData.tracks.length)*2-1).connect(masterGain);
        synth.connect(panner);

        // Schedule notes
        track.notes.forEach(note=>{
            const id = Tone.Transport.schedule(time=>{
                synth.triggerAttackRelease(note.name, note.duration, time, note.velocity);
            }, note.time);
            scheduledEvents.push(id);
        });
    });
}

// Play button
document.getElementById('play').addEventListener('click', async ()=>{
    await Tone.start();
    await scheduleTheLegendPlayback();
    Tone.Transport.start("+0.1");
    alert("Playing THE LEGEND!");
});

// WAV export button
document.getElementById('export').addEventListener('click', async ()=>{
    await Tone.start();
    await scheduleTheLegendPlayback();
    recorder.start();
    Tone.Transport.start("+0.1");

    const midiDuration = midiData.duration + 1; 
    setTimeout(async ()=>{
        Tone.Transport.stop();
        const recording = await recorder.stop();
        const url = URL.createObjectURL(recording);
        const a = document.createElement('a');
        a.href = url;
        a.download = "The_Legend_NES_Style.wav";
        a.click();
        alert("WAV export complete!");
    }, midiDuration * 1000);
});
