<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tone.js MIDI Player with Track Synths</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.39/Tone.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.27/build/Midi.min.js"></script>
<style>
body { font-family: sans-serif; text-align: center; margin-top: 50px; background: #111; color: #fff; }
input, button { padding: 10px 20px; margin: 10px; font-size: 16px; }
button { cursor: pointer; border-radius: 6px; border: none; background: #222; color: #fff; }
button:hover { background: #555; }
</style>
</head>
<body>
<h1>MIDI Player with Track Synths</h1>
<input type="file" id="midiFile" accept=".mid,.midi">
<br>
<button id="play">Play MIDI</button>

<script>
let midiData;
let scheduledEvents = [];

document.getElementById('midiFile').addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const arrayBuffer = await file.arrayBuffer();
    midiData = new Midi(arrayBuffer);
    alert("MIDI loaded! Ready to play.");
});

document.getElementById('play').addEventListener('click', async ()=>{
    if(!midiData) return alert("Please load a MIDI file first!");
    await Tone.start();

    // Clear previous scheduled events
    scheduledEvents.forEach(id => Tone.Transport.clear(id));
    scheduledEvents = [];

    // Map each track to a synth type
    midiData.tracks.forEach((track, index)=>{
        let synth;
        if(track.instrument.name.toLowerCase().includes("drum") || track.notes.length===0){
            // percussion
            synth = new Tone.MembraneSynth().toDestination();
        } else if(index % 3 === 0){
            synth = new Tone.Synth({oscillator:{type:"square"}}).toDestination(); // lead
        } else if(index % 3 === 1){
            synth = new Tone.MonoSynth({oscillator:{type:"triangle"}}).toDestination(); // bass
        } else {
            synth = new Tone.Synth({oscillator:{type:"triangle"}}).toDestination(); // harmony
        }

        // Optional: panner for stereo spread
        const panner = new Tone.Panner((index/midiData.tracks.length)*2-1).toDestination();
        synth.connect(panner);

        track.notes.forEach(note=>{
            const id = Tone.Transport.schedule(time=>{
                synth.triggerAttackRelease(
                    note.name, 
                    note.duration, 
                    time, 
                    note.velocity
                );
            }, note.time);
            scheduledEvents.push(id);
        });
    });

    Tone.Transport.start();
    alert("Playing MIDI with track synths, velocity, and panning!");
});
</script>
</body>
</html>
